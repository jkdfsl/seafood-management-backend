<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生鲜电商数据可视化大屏</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .dashboard-container {
            padding: 20px;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* 头部标题 */
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .header .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        /* 统计卡片区域 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* 图表区域 */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-left: 15px;
            border-left: 4px solid #00d4ff;
        }

        .chart-box {
            width: 100%;
            height: 300px;
        }

        /* 底部图表区域 */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .stats-row {
                grid-template-columns: repeat(3, 1fr);
            }
            .charts-row {
                grid-template-columns: 1fr;
            }
            .bottom-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 头部 -->
        <div class="header">
            <h1>🛒 生鲜电商数据可视化大屏</h1>
            <div class="subtitle">实时监控平台运营数据 | <span id="currentTime"></span></div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">总订单数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">待支付订单</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚚</div>
                <div class="stat-value" id="shippedOrders">0</div>
                <div class="stat-label">已发货订单</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">总用户数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏪</div>
                <div class="stat-value" id="totalShops">0</div>
                <div class="stat-label">入驻商家</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🥬</div>
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">商品总数</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-row">
            <div class="chart-container">
                <div class="chart-title">📈 订单趋势（最近7天）</div>
                <div id="orderTrendChart" class="chart-box"></div>
            </div>
            <div class="chart-container">
                <div class="chart-title">🥧 订单状态分布</div>
                <div id="orderStatusChart" class="chart-box"></div>
            </div>
        </div>

        <!-- 底部图表 -->
        <div class="bottom-row">
            <div class="chart-container">
                <div class="chart-title">📊 商品分类统计</div>
                <div id="productCategoryChart" class="chart-box"></div>
            </div>
            <div class="chart-container">
                <div class="chart-title">🏆 热销商品TOP10</div>
                <div id="salesRankingChart" class="chart-box"></div>
            </div>
        </div>
    </div>

    <script>
        // 设置当前时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('currentTime').textContent = timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 基础URL
        const baseUrl = 'http://localhost:8890/springbootcug86';

        // 初始化图表
        let orderTrendChart, orderStatusChart, productCategoryChart, salesRankingChart;

        function initCharts() {
            orderTrendChart = echarts.init(document.getElementById('orderTrendChart'));
            orderStatusChart = echarts.init(document.getElementById('orderStatusChart'));
            productCategoryChart = echarts.init(document.getElementById('productCategoryChart'));
            salesRankingChart = echarts.init(document.getElementById('salesRankingChart'));

            // 响应式
            window.addEventListener('resize', () => {
                orderTrendChart.resize();
                orderStatusChart.resize();
                productCategoryChart.resize();
                salesRankingChart.resize();
            });
        }

        // 获取统计数据
        async function loadStatistics() {
            try {
                const response = await fetch(`${baseUrl}/dashboard/statistics`);
                const result = await response.json();
                
                if (result.code === 0) {
                    const data = result.data;
                    document.getElementById('totalOrders').textContent = data.totalOrders || 0;
                    document.getElementById('pendingOrders').textContent = data.pendingOrders || 0;
                    document.getElementById('shippedOrders').textContent = data.shippedOrders || 0;
                    document.getElementById('totalUsers').textContent = data.totalUsers || 0;
                    document.getElementById('totalShops').textContent = data.totalShops || 0;
                    document.getElementById('totalProducts').textContent = data.totalProducts || 0;
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }

        // 获取订单趋势数据
        async function loadOrderTrend() {
            try {
                const response = await fetch(`${baseUrl}/dashboard/orderTrend`);
                const result = await response.json();
                
                if (result.code === 0) {
                    const data = result.data;
                    const dates = data.map(item => item.date);
                    const counts = data.map(item => item.count);

                    const option = {
                        tooltip: {
                            trigger: 'axis',
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            borderColor: '#00d4ff',
                            textStyle: { color: '#fff' }
                        },
                        grid: {
                            left: '3%',
                            right: '4%',
                            bottom: '3%',
                            containLabel: true
                        },
                        xAxis: {
                            type: 'category',
                            data: dates,
                            axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                            axisLabel: { color: '#fff' }
                        },
                        yAxis: {
                            type: 'value',
                            axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                            axisLabel: { color: '#fff' },
                            splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.1)' } }
                        },
                        series: [{
                            data: counts,
                            type: 'line',
                            smooth: true,
                            symbol: 'circle',
                            symbolSize: 8,
                            lineStyle: {
                                color: '#00d4ff',
                                width: 3
                            },
                            itemStyle: {
                                color: '#00d4ff',
                                borderColor: '#fff',
                                borderWidth: 2
                            },
                            areaStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: 'rgba(0, 212, 255, 0.5)' },
                                    { offset: 1, color: 'rgba(0, 212, 255, 0.05)' }
                                ])
                            }
                        }]
                    };
                    orderTrendChart.setOption(option);
                }
            } catch (error) {
                console.error('加载订单趋势失败:', error);
            }
        }

        // 获取订单状态分布
        async function loadOrderStatus() {
            try {
                const response = await fetch(`${baseUrl}/dashboard/orderStatus`);
                const result = await response.json();
                
                if (result.code === 0) {
                    const data = result.data;

                    const option = {
                        tooltip: {
                            trigger: 'item',
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            borderColor: '#00d4ff',
                            textStyle: { color: '#fff' },
                            formatter: '{b}: {c} ({d}%)'
                        },
                        legend: {
                            orient: 'vertical',
                            right: '10%',
                            top: 'center',
                            textStyle: { color: '#fff' }
                        },
                        series: [{
                            type: 'pie',
                            radius: ['40%', '70%'],
                            center: ['40%', '50%'],
                            avoidLabelOverlap: false,
                            itemStyle: {
                                borderRadius: 10,
                                borderColor: '#1a1a2e',
                                borderWidth: 2
                            },
                            label: {
                                show: false,
                                position: 'center'
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: 20,
                                    fontWeight: 'bold',
                                    color: '#fff'
                                }
                            },
                            labelLine: { show: false },
                            data: data,
                            color: ['#00d4ff', '#7b2cbf', '#ff006e', '#fb5607', '#ffbe0b', '#8338ec']
                        }]
                    };
                    orderStatusChart.setOption(option);
                }
            } catch (error) {
                console.error('加载订单状态失败:', error);
            }
        }

        // 获取商品分类统计
        async function loadProductCategory() {
            try {
                const response = await fetch(`${baseUrl}/dashboard/productCategory`);
                const result = await response.json();
                
                if (result.code === 0) {
                    const data = result.data;
                    const names = data.map(item => item.name);
                    const values = data.map(item => item.value);

                    const option = {
                        tooltip: {
                            trigger: 'axis',
                            axisPointer: { type: 'shadow' },
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            borderColor: '#00d4ff',
                            textStyle: { color: '#fff' }
                        },
                        grid: {
                            left: '3%',
                            right: '4%',
                            bottom: '3%',
                            containLabel: true
                        },
                        xAxis: {
                            type: 'category',
                            data: names,
                            axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                            axisLabel: { 
                                color: '#fff',
                                rotate: 30,
                                interval: 0
                            }
                        },
                        yAxis: {
                            type: 'value',
                            axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                            axisLabel: { color: '#fff' },
                            splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.1)' } }
                        },
                        series: [{
                            data: values,
                            type: 'bar',
                            barWidth: '50%',
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: '#00d4ff' },
                                    { offset: 1, color: '#7b2cbf' }
                                ]),
                                borderRadius: [8, 8, 0, 0]
                            }
                        }]
                    };
                    productCategoryChart.setOption(option);
                }
            } catch (error) {
                console.error('加载商品分类失败:', error);
            }
        }

        // 获取销售排行
        async function loadSalesRanking() {
            try {
                const response = await fetch(`${baseUrl}/dashboard/salesRanking`);
                const result = await response.json();
                
                if (result.code === 0) {
                    const data = result.data;
                    const names = data.map(item => item.name).reverse();
                    const values = data.map(item => item.value).reverse();

                    const option = {
                        tooltip: {
                            trigger: 'axis',
                            axisPointer: { type: 'shadow' },
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            borderColor: '#00d4ff',
                            textStyle: { color: '#fff' }
                        },
                        grid: {
                            left: '3%',
                            right: '4%',
                            bottom: '3%',
                            containLabel: true
                        },
                        xAxis: {
                            type: 'value',
                            axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                            axisLabel: { color: '#fff' },
                            splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.1)' } }
                        },
                        yAxis: {
                            type: 'category',
                            data: names,
                            axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                            axisLabel: { color: '#fff' }
                        },
                        series: [{
                            data: values,
                            type: 'bar',
                            barWidth: '60%',
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [
                                    { offset: 0, color: '#ff006e' },
                                    { offset: 1, color: '#ffbe0b' }
                                ]),
                                borderRadius: [0, 8, 8, 0]
                            },
                            label: {
                                show: true,
                                position: 'right',
                                color: '#fff',
                                formatter: '{c}件'
                            }
                        }]
                    };
                    salesRankingChart.setOption(option);
                }
            } catch (error) {
                console.error('加载销售排行失败:', error);
            }
        }

        // 加载所有数据
        async function loadAllData() {
            await loadStatistics();
            await loadOrderTrend();
            await loadOrderStatus();
            await loadProductCategory();
            await loadSalesRanking();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            loadAllData();
            
            // 每30秒刷新一次数据
            setInterval(loadAllData, 30000);
        });
    </script>
</body>
</html>
