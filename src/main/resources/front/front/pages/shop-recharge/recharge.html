<!-- 充值 -->
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>充值</title>
		<link rel="stylesheet" href="../../layui/css/layui.css">
		<!-- 样式 -->
		<link rel="stylesheet" href="../../css/style.css" />
		<!-- 主题（主要颜色设置） -->
		<link rel="stylesheet" href="../../css/theme.css" />
		<!-- 通用的css -->
		<link rel="stylesheet" href="../../css/common.css" />
		<style type="text/css">
			.pay-type-list {
				display: flex;
				align-items: center;
				flex-wrap: wrap;
			}

			.pay-type-item {
				background: #FFFFFF;
				border: 3px dotted #EEEEEE;
				margin: 20px;
				padding: 20px;
				width: 200px;
			}
		</style>
	</head>
	<body style="background: #EEEEEE;">

		<div id="app">

			<form class="layui-form" lay-filter="myForm">
				<div class="layui-form-item" style="margin: 20px;background: #FFFFFF;border:3px dotted #EEEEEE;padding: 20px;">
					<label class="layui-form-label">充值金额</label>
					<div class="layui-input-block">
						<input type="number" name="money" id="money" required lay-verify="required" placeholder="充值金额" autocomplete="off"
						 class="layui-input">
					</div>
				</div>
				<div class="pay-type-list">
					<div class="pay-type-item">
						<input type="radio" name="type" value="微信支付" checked>
						<img  src="../../img/weixin.png" alt>
						<span>微信支付</span>
					</div>
					<div class="pay-type-item">
						<input type="radio" name="type" value="支付宝支付">
						<img src="../../img/zhifubao.png" alt>
						<span>支付宝支付</span>
					</div>
					<div class="pay-type-item">
						<input type="radio" name="type" value="建设银行">
						<img style="width: 120px;height: 60px;" src="../../img/jianshe.png" alt>
					</div>
					<div class="pay-type-item">
						<input type="radio" name="type" value="农业银行">
						<img style="width: 120px;height: 60px;" src="../../img/nongye.png" alt>
					</div>
					<div class="pay-type-item">
						<input type="radio" name="type" value="中国银行">
						<img style="width: 120px;height: 60px;" src="../../img/zhongguo.png" alt>
					</div>
					<div class="pay-type-item">
						<input type="radio" name="type" value="交通银行">
						<img style="width: 120px;height: 60px;" src="../../img/jiaotong.png" alt>
					</div>
				</div>
				<button style="margin-left: 20px;width:860px;height: 40px;line-height: 40px;" class="layui-btn btn-submit btn-theme"
				 lay-submit lay-filter="*">确认支付</button>
			</form>

		</div>

		<!-- layui -->
		<script src="../../layui/layui.js"></script>
		<!-- vue -->
		<script src="../../js/vue.js"></script>
		<!-- 组件配置信息 -->
		<script src="../../js/config.js"></script>
		<!-- 扩展插件配置信息 -->
		<script src="../../modules/config.js"></script>
		<!-- 工具方法 -->
		<script src="../../js/utils.js"></script>
		<!-- 校验格式工具类 -->
		<script src="../../js/validate.js"></script>

		<script>
			var vue = new Vue({
				el: '#app',
				data: {
					user: {}
				},
				filters: {
					newsDesc: function(val) {
						if (val) {
							if (val.length > 200) {
								return val.substring(0, 200).replace(/<[^>]*>/g).replace(/undefined/g, '');
							} else {
								return val.replace(/<[^>]*>/g).replace(/undefined/g, '');
							}
						}
						return '';
					}
				},
				methods: {
					jump(url) {
						jump(url)
					}
				}
			})

			layui.use(['layer', 'element', 'http', 'jquery', 'form'], function() {
				var layer = layui.layer;
				var element = layui.element;
				var http = layui.http;
				var jquery = layui.jquery;
				var form = layui.form;

				// 查询用户信息
				let table = localStorage.getItem("userTable");
				http.request(`${table}/session`, 'get', {}, function(data) {
					vue.user = data.data;
				});
				
				// 提交表单
				form.on('submit(*)', function(data) {
					// 添加金额
					data = data.field;
					console.log(data);
					if(Number(data.money)<=0) {
                                                layer.msg('请输入正确金额', {
                                                        time: 1000,
                                                        icon:5 
                                                });
                                                return false;
                                        }
					
					// 保存充值金额，用于后续回调
					var rechargeAmount = Number(data.money);
					var payType = data.type;
					
					// 先保存充值记录
					// 格式化日期为 yyyy-MM-dd HH:mm:ss
					var now = new Date();
					var year = now.getFullYear();
					var month = String(now.getMonth() + 1).padStart(2, '0');
					var day = String(now.getDate()).padStart(2, '0');
					var hours = String(now.getHours()).padStart(2, '0');
					var minutes = String(now.getMinutes()).padStart(2, '0');
					var seconds = String(now.getSeconds()).padStart(2, '0');
					var formattedDate = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
					
					var chongjilu = {
						yonghuzhanghao: vue.user.zhanghao,
						yonghuxingming: vue.user.xingming,
						chongzhijine: rechargeAmount,
						chongzhifangshi: payType,
						chongzhishijian: formattedDate,
						ispay: '已支付'
					};
					
					http.requestJson('chongjilu/add', 'post', chongjilu, function(res) {
						// 充值记录保存成功后，更新用户余额
						// 重新获取当前用户信息，确保使用最新的数据
						let table = localStorage.getItem("userTable");
						http.request(table + '/session', 'get', {}, function(sessionData) {
							var currentUser = sessionData.data;
							// 计算新余额
							var newMoney = Number(currentUser.money || 0) + rechargeAmount;
							
							// 只更新余额字段，避免覆盖其他字段
							var updateData = {
								id: currentUser.id,
								money: newMoney
							};
							
							console.log('准备更新余额:', updateData);
							
							// 更新用户余额到数据库
							http.requestJson(table + '/update', 'post', updateData, function(result) {
								console.log('余额更新成功:', result);
								layer.msg('充值成功，余额已更新', {
									time: 2000,
									icon: 6
								}, function() {
									// 刷新父页面中的iframe（个人中心页面）
									try {
										// 方法1: 刷新整个父页面
										window.parent.location.reload();
									} catch(e) {
										console.log('刷新父页面失败', e);
										// 方法2: 如果方法1失败，尝试刷新iframe
										var parentIframe = window.parent.document.getElementById('iframe');
										if(parentIframe) {
											parentIframe.src = parentIframe.src;
										}
									}
								});
							}, function(error) {
								layer.msg('余额更新失败，请联系客服', {
									time: 3000,
									icon: 5
								});
								console.error('更新余额失败:', error);
							});
						}, function(error) {
							layer.msg('获取用户信息失败', {
								time: 2000,
								icon: 5
							});
							console.error('获取用户信息失败:', error);
						});
					}, function(error) {
						layer.msg('充值记录保存失败', {
							time: 2000,
							icon: 5
						});
						console.error('保存充值记录失败:', error);
					});
					return false
				});

			});
		</script>
	</body>
</html>
